<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من التحديثات - iBrowser</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <div class="page-logo">
                <img src="../assets/logo/worksuite-logo.png" alt="iBrowser Logo">
                <h1>iBrowser</h1>
            </div>
            <button type="button" id="close-page" class="close-button"><i class="fas fa-times"></i></button>
        </div>

        <div class="page-content">
            <h2>التحقق من التحديثات</h2>

            <div class="update-container">
                <div class="current-version">
                    <h3>الإصدار الحالي</h3>
                    <div class="version-info">
                        <span class="version-number" id="current-version-number">—</span>
                    </div>
                </div>

                <div class="update-status" id="update-status">
                    <div class="checking-updates">
                        <i class="fas fa-sync-alt fa-spin"></i>
                        <p>جاري التحقق من وجود تحديثات...</p>
                    </div>
                </div>

                <div class="update-actions">
                    <button type="button" id="check-updates-btn" class="primary-button">
                        <i class="fas fa-sync-alt"></i>
                        التحقق من التحديثات
                    </button>
                </div>

                <p class="update-note">
                    يتحقق iBrowser من أحدث إصدار منشور على GitHub Releases. عند توفر تحديث سيتم فتح صفحة
                    الإصدار في المتصفح الافتراضي لتنزيله.
                </p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('close-page').addEventListener('click', () => {
            window.close();
        });

        async function updateCurrentVersion() {
            const versionNumber = document.getElementById('current-version-number');
            try {
                const version = await window.ibrowser.app.getVersion();
                versionNumber.textContent = version;
            } catch (err) {
                versionNumber.textContent = 'غير معروف';
            }
        }

        function renderChecking() {
            document.getElementById('update-status').innerHTML = `
                <div class="checking-updates animate__animated animate__fadeIn">
                    <i class="fas fa-sync-alt fa-spin"></i>
                    <p>جاري التحقق من وجود تحديثات...</p>
                </div>
            `;
        }

        function renderAvailable(result) {
            const notes = result.notes
                ? `<div class="release-notes-container"><h4>ملاحظات الإصدار:</h4><p class="release-notes">${escapeHtml(result.notes)}</p></div>`
                : '';

            document.getElementById('update-status').innerHTML = `
                <div class="update-available animate__animated animate__fadeIn">
                    <div class="update-icon-container">
                        <i class="fas fa-arrow-circle-up"></i>
                        <span class="update-badge">${escapeHtml(result.latest)}</span>
                    </div>
                    <p class="update-title">يوجد تحديث جديد متاح!</p>
                    <div class="update-info">
                        <div class="update-info-item">
                            <i class="fas fa-code-branch"></i>
                            <span>الإصدار الجديد: <strong>${escapeHtml(result.latest)}</strong></span>
                        </div>
                    </div>
                    ${notes}
                    <button id="open-release-btn" class="primary-button">
                        <i class="fas fa-external-link-alt"></i>
                        فتح صفحة التنزيل
                    </button>
                </div>
            `;

            document.getElementById('open-release-btn').addEventListener('click', () => {
                window.ibrowser.updates.openRelease(result.url);
            });
        }

        function renderUpToDate() {
            document.getElementById('update-status').innerHTML = `
                <div class="up-to-date animate__animated animate__fadeIn">
                    <i class="fas fa-check-circle" style="font-size: 42px; color: #04a3a8;"></i>
                    <p>تم التحقق بنجاح!</p>
                    <p class="success-message">أنت الآن تستخدم أحدث إصدار من iBrowser!</p>
                    <span class="last-checked">آخر تحقق: ${new Date().toLocaleString('ar-SA')}</span>
                </div>
            `;
        }

        function renderError(message) {
            document.getElementById('update-status').innerHTML = `
                <div class="update-error animate__animated animate__fadeIn">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>تعذر التحقق من التحديثات</p>
                    <p class="error-message">${escapeHtml(message || 'خطأ غير معروف')}</p>
                </div>
            `;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = String(str == null ? '' : str);
            return div.innerHTML;
        }

        async function runCheck() {
            renderChecking();
            try {
                const result = await window.ibrowser.updates.check();
                if (result.status === 'available') {
                    renderAvailable(result);
                } else if (result.status === 'not-available') {
                    renderUpToDate();
                } else {
                    renderError(result.error);
                }
            } catch (err) {
                renderError(err.message);
            }
        }

        document.getElementById('check-updates-btn').addEventListener('click', runCheck);

        window.addEventListener('DOMContentLoaded', () => {
            updateCurrentVersion();
            setTimeout(runCheck, 400);
        });
    </script>
</body>
</html>
